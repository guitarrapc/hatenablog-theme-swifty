<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swifty - はてなブログテーマ</title>
  <!--
    はてなブログのテーマストアに載せる画像(620×460)の元のページ。capture-theme-store-catch.js で theme-store-catch.png にする。
    記事の画像は capture-screenshots.js(npm run screenshots -- store-article)で撮った articles/screenshots/store-article-*.png を使う
    (幅1440pxの画面を2倍の解像度で撮ったもの。タイトルとカテゴリは画像用の文言)。並べる配色を変えるときは、capture-screenshots.js の STORE_SHEETS も合わせる。
    テーマストアの一覧では300×223に縮めて表示され、右上の角に帯(レスポンシブ対応、順位)が重なる。
    名前とコピーは縮めても読める大きさにして、右上には置かない
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600&family=Zen+Kaku+Gothic+New:wght@700&display=block"
    rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #e9e9e9;
      font-family: "Zen Kaku Gothic New", "Noto Sans JP", sans-serif;
    }

    /* テーマストアの画像の大きさ。地は既定の配色(mint)の淡い色 */
    .container {
      position: relative;
      width: 620px;
      height: 460px;
      overflow: hidden;
      background: linear-gradient(150deg, #edf8f5, #c9ebe3);
    }

    /* 地のざらつき。平らなグラデーションをやわらげる */
    .grain {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.22;
      mix-blend-mode: soft-light;
    }

    /* 名前とコピー */
    .title-area {
      position: absolute;
      top: 46px;
      left: 44px;
      color: #173a35;
    }

    .logo {
      display: flex;
      align-items: center;
    }

    /* ロゴの「S」で Swifty と書く。上の尾が右へ伸びるぶん画像の幅がSより広いので、負の余白で「wifty」に寄せる */
    .logo img {
      height: 58px;
      margin-right: -11px;
    }

    .theme-title {
      font-family: "Quicksand", sans-serif;
      font-size: 58px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: 0.01em;
    }

    .theme-copy {
      margin-top: 26px;
      font-size: 27px;
      font-weight: 700;
      line-height: 1.55;
      letter-spacing: 0.06em;
    }

    /* 記事の束。束ごと奥へ傾けて回し、右と下は画像の外へはみ出させる。辺が平行になるよう、角度は束にだけ付ける */
    .sheets {
      position: absolute;
      top: 96px;
      left: 388px;
      width: 600px;
      height: 620px;
      transform: perspective(1500px) rotateX(16deg) rotateY(-20deg) rotateZ(7deg);
      transform-origin: 0 0;
      /* 後ろの記事を1枚ごとにずらす幅(記事の辺に沿った向き)。
         2枚目の角がコピーの右に収まり、後ろの記事のタイトルの頭といちばん奥のタイトルが見える大きさ */
      --step-x: -98px;
      --step-y: 92px;
    }

    /* 記事1枚。配色ごとのスクリーンショット(幅1440pxの画面)を --scale 倍にして、画面の(--x, --y)を左上に合わせる。
       配色ごとの背景色が見えるよう、記事のカードの角の少し外(ページの背景)から切り取る。
       --i は手前から何枚目か(0が手前)。同じ幅ずつ左下へずらして重ねる */
    .sheet {
      position: absolute;
      inset: 0;
      border-radius: 18px;
      background-color: #fff;
      background-repeat: no-repeat;
      background-size: calc(1440px * var(--scale)) auto;
      background-position: calc(var(--x) * var(--scale) * -1px) calc(var(--y) * var(--scale) * -1px);
      box-shadow: 0 1px 2px rgba(22, 80, 70, 0.08), -16px 26px 50px -14px rgba(22, 80, 70, 0.32);
      transform: translate(calc(var(--step-x) * var(--i)), calc(var(--step-y) * var(--i)));
      --scale: 0.6;
      --x: 112;
      --y: 160;
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- 奥から順に置く。手前は既定の配色、いちばん奥はダーク -->
    <div class="sheets">
      <div class="sheet" style="--i: 3; background-image: url('articles/screenshots/store-article-mint-dark.png');"></div>
      <div class="sheet" style="--i: 2; background-image: url('articles/screenshots/store-article-beige.png');"></div>
      <div class="sheet" style="--i: 1; background-image: url('articles/screenshots/store-article-pink-green.png');"></div>
      <div class="sheet" style="--i: 0; background-image: url('articles/screenshots/store-article-mint.png');"></div>
    </div>
    <svg class="grain" aria-hidden="true">
      <filter id="grain">
        <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch" />
        <feColorMatrix type="saturate" values="0" />
      </filter>
      <rect width="100%" height="100%" filter="url(#grain)" />
    </svg>
    <div class="title-area">
      <div class="logo">
        <img src="assets/logo_mark.png" alt="">
        <h1 class="theme-title">wifty</h1>
      </div>
      <p class="theme-copy">好きな色で<br>ブログを書こう</p>
    </div>
  </div>
</body>

</html>
